[project]
name = "tradingagent"
version = "0.1.0"
description = "Agent de signaux de trading Deriv - or et crypto"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pre-commit-hooks>=4.6",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingagent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# DTZ: naive datetimes are forbidden, every timestamp is UTC (Project Context, Conventions).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["tradingagent", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# A secret detector is made of secret-shaped names; S105 stays active everywhere else.
"tools/detect_secrets_plugins/**" = ["S105"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "tools"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Packages where a typing error can cost money get the strict profile.
[[tool.mypy.overrides]]
module = [
    "tradingagent.risk",
    "tradingagent.risk.*",
    "tradingagent.indicators",
    "tradingagent.indicators.*",
    "tradingagent.analytics",
    "tradingagent.analytics.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
strict_equality = true
implicit_reexport = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
