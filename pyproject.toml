[project]
name = "tradingagent"
version = "0.1.0"
description = "Agent de signaux de trading Deriv - or et crypto"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "fastapi>=0.116",
    "jinja2>=3.1",
    "metatrader5>=5.0.6231 ; sys_platform == 'win32'",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=22",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "truststore>=0.10.4",
    "uvicorn>=0.35",
]

[project.scripts]
tradingagent = "tradingagent.control.cli:main"
tradingagent-bot = "tradingagent.notify.telegram_app:main"
tradingagent-run = "tradingagent.app:main"
tradingagent-web = "tradingagent.web.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pre-commit-hooks>=4.6",
    "detect-secrets>=1.5",
    "types-pyyaml>=6.0.12.20260906",
    "defusedxml>=0.7.1",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingagent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# DTZ: naive datetimes are forbidden, every timestamp is UTC (Project Context, Conventions).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["tradingagent", "tools"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, deliberately fake credentials, and seeded PRNGs for reproducible data.
"tests/**" = ["S101", "S105", "S106", "S311"]
# Generated by Alembic autogenerate: long enum CHECK strings cannot be wrapped.
"src/tradingagent/storage/migrations/versions/**" = ["E501"]
# A secret detector is made of secret-shaped names; S105 stays active everywhere else.
"tools/detect_secrets_plugins/**" = ["S105"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Packages where a typing error can cost money get the strict profile.
[[tool.mypy.overrides]]
module = [
    "tradingagent.risk",
    "tradingagent.risk.*",
    "tradingagent.indicators",
    "tradingagent.indicators.*",
    "tradingagent.analytics",
    "tradingagent.analytics.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
strict_equality = true
implicit_reexport = false

# MetaTrader5 ships no type information and installs on Windows only.
[[tool.mypy.overrides]]
module = ["MetaTrader5"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "mt5_live: needs a running MT5 terminal logged into the demo account; set RUN_MT5_LIVE=1",
]
