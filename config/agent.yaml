# Agent configuration (TASK-006 format, revised by TASK-031 and C-007/Q-07 on 2026-10-04).
# The only market is gold (XAUUSD): synthetic indices are refused to French residents (C-008)
# and the Deriv API is unavailable (C-010). Gold only, by operator decision of
# 2026-11-03. Timeframes come from each strategy manifest, never from this file.
#
# Risk thresholds are the defaults decided by the operator on 2026-10-04 (RM-005 to RM-007):
# simulated mode risks 0.5 % per trade, live mode 2 % (capped at 5 % by RM-005).
#
# The strategy is `vwap_pullback` (VWAP anchored at 00:00 UTC, momentum, entry on pullback),
# put in service on 2026-10-10 by operator decision. It replaces `witness@1.1.1`, which is no
# longer executed; its manifest and code stay in the repository, because a published manifest is
# never rewritten and its measurements remain the record of why that rule was not kept.
#
# The replacement is a DEMO ceiling carried by an explicit operator derogation, not a
# validation. Measured on frozen M15 bars with the repository's costs and the exit production
# actually takes: net profit factor 0,5454 (gold, 231 validation trades) against the 1,20 the
# project requires. The operator chose to run it on the DEMONSTRATION account anyway, knowing
# that figure: no real money is at stake, and the dashboard then shows what the rule really does.
markets:
  - symbol: XAUUSD
    enabled: true
    strategy: vwap_pullback@1.2.0
risk:
  simulated:
    risk_per_trade_pct: 0.5
    daily_loss_pct: 2
    weekly_loss_pct: 6
    max_drawdown_pct: 10
    # Unlimited by operator decision (2026-10-30): no cap on open positions, positions per market
    # or trades per day; the counts are still recorded with each decision. Capital protection
    # remains risk_per_trade, daily/weekly loss, drawdown and the exposure ceiling.
    max_open_positions: null
    max_positions_per_market: null
    max_trades_per_day: null
    # Scalping (2026-11-03): no pause after losses; the daily loss limit is the brake.
    cooldown_after_losses: 3
    cooldown_hours: 0
    # 4 consecutive losses closed on the same UTC day on one timeframe (M1, M5, M15, M30): that
    # timeframe takes no new trade until 00:00 UTC, the others keep trading (null = off).
    stop_after_consecutive_losses_per_day: 4
    max_spread_stop_pct: 10
    # Spread + commission + one day of swap may eat at most half the distance to TP1, so a trade
    # that reaches only its first target still nets a gain (TASK-067). null = not enforced.
    max_cost_to_target: 0.5
    margin_usage_pct: 50
  live:
    reference_capital: 100
    currency: EUR
    # Reduced-risk ramp imposed at activation (TASK-091/TASK-092): 2 % per trade, 5 % a day.
    risk_per_trade_pct: 2
    daily_loss_pct: 5
    weekly_loss_pct: 10
    max_drawdown_pct: 20
    # Unlimited by operator decision (2026-10-30): no cap on open positions, positions per market
    # or trades per day; the counts are still recorded with each decision. Capital protection
    # remains risk_per_trade, daily/weekly loss, drawdown and the exposure ceiling.
    max_open_positions: null
    max_positions_per_market: null
    max_trades_per_day: null
    cooldown_after_losses: 2
    cooldown_hours: 12
    stop_after_consecutive_losses_per_day: 3
    max_spread_stop_pct: 10
    # Spread + commission + one day of swap may eat at most half the distance to TP1, so a trade
    # that reaches only its first target still nets a gain (TASK-067). null = not enforced.
    max_cost_to_target: 0.5
    margin_usage_pct: 50

# Economic calendar (optional; every value below is the default, so the section can be omitted).
# A candidate signal is refused when it would open inside the window around a high-impact
# announcement (30 minutes either side for FOMC / NFP / CPI / rate decisions). The AI only reads
# the calendar; a missing key or a dead feed never stops the agent (the gate fails open).
# `fail_closed_when_blind` flips that for real money only: with it true AND trading_mode LIVE, a
# calendar the gate cannot see (never fetched, older than max_staleness_minutes, or an empty
# weekday export) REFUSES new signals with a motif instead of letting them through. It stays
# reject-only (it never creates or loosens a signal). In DEMO it changes nothing:
# the gate keeps failing open and says so with a `news_gate_degraded` warning (once per episode).
# news:
#   enabled: true
#   fail_closed_when_blind: false
#   poll_minutes: 20
#   daily_hour_utc: 6
#   ai_daily_budget_eur: 0.30
#   blackout:
#     enabled: true
#     high_before_minutes: 15
#     high_after_minutes: 15
#     major_before_minutes: 30
#     major_after_minutes: 30
#     medium_enabled: false
