# CANDIDAT EN COURS DE VALIDATION — ne pas promouvoir avant que les neuf portes le retiennent.
#
# Geometrie de sortie elargie, mesuree le 2026-10-10 par balayage sur le jeu gele de 59 999
# bougies M15 (`docs/research/2026-10-10-geometrie-de-sortie-balayage.md`) :
#
#   * objectifs portes de 0,8 R / 1,5 R a 2,0 R / 4,0 R, stop inchange a 1,5 ATR ;
#   * resultat sur la fenetre de validation du BTC : PF net 1,0275 et +31,56 EUR sur 170
#     operations, contre PF 0,6818 et -327,71 EUR pour la geometrie actuelle ;
#   * la progression est monotone dans l'elargissement (0,68 -> 0,71 -> 0,91 -> 1,03), ce qui
#     est la signature d'un effet reel et non d'un point chanceux ;
#   * sur l'or la meme geometrie ne franchit rien (validation 0,7141) : elle est donc declaree
#     sur BTCUSD SEUL, et ce fichier n'autorise pas XAUUSD.
#
# CE QUI RESTE A PROUVER, ET C'EST TOUT L'OBJET DE CETTE VERSION : le plancher de 1,00 etait la
# condition d'adoption d'un balayage, pas une validation. Le gain tient sur UNE fenetre de
# validation et 170 operations, soit 2,75 % de marge. Les neuf portes du §49 — plis walk-forward,
# Monte-Carlo, correction de tests multiples, stress a 2x couts, robustesse des parametres — n'ont
# pas encore ete rejouees sur cette geometrie.
#
# Le plafond reste SIGNAL tant que les portes n'ont pas rendu leur verdict : une geometrie
# mesuree n'est pas une geometrie validee, et la relever avant serait exactement l'escalade
# silencieuse que le catalogue refuse.
strategy_id: vwap_pullback
version: 1.3.0
max_mode: SIGNAL
allowed_symbols: [BTCUSD]
timeframes: [M15]
# 8 x ema_slow : l'EMA(50) et le VWAP lisse sont recursifs et doivent etre chauffes a
# l'identique entre le backtest et la production. 400 barres couvrent la fenetre de pente (10),
# le VWAP lisse (20) et l'EMA lente (50) avec une marge confortable.
history_bars: 400
expiry_bars: 2
ai_filter: shadow
parameters:
  ema_fast: 20
  ema_slow: 50
  vwap_period: 20
  atr_period: 14
  stop_atr_multiplier: 1.5
  # Les deux objectifs, elargis ensemble et mesures ensemble : 0,8/1,5 devient 2,0/4,0.
  first_target_rr: 2.0
  final_target_rr: 4.0
  pullback_atr: 0.4
  entry_zone_atr: 0.1
  min_slope_atr: 0.005
  slope_window: 10
