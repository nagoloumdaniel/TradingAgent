# vwap_pullback 1.4.0 -- BTCUSD, DEMO only (derogation below). Successor of 1.2.0 (same rule, same exits 0.8R/1.5R,
# same 1.5 ATR stop) with ONE addition: the entry must go WITH the named trend, read with
# EMA 10/30 and a one-bar slope above 0.05 ATR (the defaults of `entry_features`, not tuned).
#
# Why (docs/research/2026-10-28-diagnostic-pertes-demo.md): the rule loses on every slice except
# "with the trend". Measured on 59 999 frozen M15 bars, repository costs, exit at the first
# target as production executes it, anchored 60/20 split, sealed set NOT opened:
#   train       PF 0.7148 -> 0.8215   (709 -> 88 trades)
#   validation  PF 0.6818 -> 1.3916   (205 -> 35 trades)
#   train+valid PF 0.7073 -> 0.9441   (914 -> 123 trades), still below 1.00 and below the 1.20 bar.
# The window after the frozen sets (live life of the agent) holds only 5 candidate trades: not
# conclusive. The "with the trend" slice was found by looking at 164 slices on train+validation,
# so those two windows are not independent of the discovery.
#
# DEROGATION OPERATEUR du 2026-10-29 : plafond releve de SIGNAL a DEMO, sans validation.
#
# Decision de l'operateur, prise en connaissance des chiffres ci-dessous, pour faire tourner ce
# candidat sur le COMPTE DE DEMONSTRATION uniquement, ou aucun argent reel n'est en jeu.
# `max_mode: DEMO` est un plafond borne : il n'atteint pas le compte reel (RM-016, RM-017).
# Chiffres de validation qui manquent :
#   * profit factor net 0.9441 en entrainement + validation (123 operations), 1.3916 en
#     validation seule (35 operations), contre 1.2 exige ; le profit factor cumule reste sous 1 ;
#   * p-value minimale 0,998 et ligne de Bonferroni 0,016667 : mesures de la 1.2.0 (meme regle),
#     NON remesurees pour ce candidat ;
#   * 0 survivant sur 7 apres correction du taux de fausses decouvertes (mesure de la 1.2.0).
# Le filtre "avec la tendance" a ete trouve en regardant 164 tranches des memes donnees : ces
# fenetres ne sont pas independantes de la decouverte. Le jeu scelle n'est PAS ouvert.
# Retour arriere : remettre BTCUSD sur vwap_pullback@1.2.0 dans config/agent.yaml.
# 1.2.0 reste publie et non modifie.
strategy_id: vwap_pullback
version: 1.4.0
max_mode: DEMO
allowed_symbols: [BTCUSD]
timeframes: [M15]
history_bars: 400
expiry_bars: 2
ai_filter: shadow
parameters:
  ema_fast: 20
  ema_slow: 50
  vwap_period: 20
  atr_period: 14
  stop_atr_multiplier: 1.5
  first_target_rr: 0.8
  final_target_rr: 1.5
  pullback_atr: 0.4
  entry_zone_atr: 0.1
  min_slope_atr: 0.005
  slope_window: 10
  trend_filter: true
  trend_ema_fast: 10
  trend_ema_slow: 30
  trend_slope_atr: 0.05
