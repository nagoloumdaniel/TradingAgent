# DEROGATION OPERATEUR du 2026-10-08 : plafond releve de SIGNAL a DEMO, sans validation.
#
# RM-016 veut qu'un manifeste declare le lieu le plus eleve ou il peut servir, et la regle du
# projet est de ne relever ce plafond qu'apres une validation hors echantillon. Ce n'est PAS le
# cas ici : la campagne du 2026-10-08 a refuse 6 portes sur 9 sur ces deux strategies.
#
# Ce fichier existe donc pour repeter le systeme sur le COMPTE DE DEMONSTRATION, ou aucun argent
# reel n'est en jeu. `max_mode: DEMO` est un plafond borne : il ne peut pas atteindre le compte
# reel, qui exigerait `max_mode: LIVE` ET les neuf portes franchies (RM-016, RM-017).
#
# Chiffres de validation qui manquent, a la date de la derogation (11 999 bougies M15) :
#   * profit factor net (1x couts) mesure 0,92 (BTC) et 1,04 (or), exige 1,20 ; a 2x couts
#     (porte stress) il retombe a 0,81 (BTC) et 0,90 (or) ;
#   * p-value minimale 0,3497, contre la ligne de Bonferroni 0,016667, soit 21 fois au-dessus ;
#   * 0 survivant sur 6 apres correction du taux de fausses decouvertes.
#
# Le catalogue refuse tout manifeste au-dessus de SIGNAL qui ne porte pas ce bandeau :
# l'escalade silencieuse est impossible (voir docs/decisions/2026-10-08-mode-ceiling-derogation.md).
#
# Production manifest for gold. Supersedes 1.0.0, which referenced the inexistent
# `frxXAUUSD` (see ROADMAP.md, Project Context). max_mode stays SIGNAL until a strategy
# is validated out of sample and promoted through TASK-065 (RM-016).
strategy_id: witness
version: 1.1.1
max_mode: DEMO
allowed_symbols: [XAUUSD]
timeframes: [M15]
# 6 x ema_slow: recursive indicators need warm-up for backtest/production parity.
history_bars: 300
expiry_bars: 1
ai_filter: shadow
parameters:
  ema_fast: 20
  ema_slow: 50
  atr_period: 14
  stop_atr_multiplier: 1.5
  take_profit_rr: 2.0
  entry_zone_atr: 0.1
