# DEROGATION OPERATEUR du 2026-10-08 : plafond releve de SIGNAL a DEMO, sans validation.
#
# RM-016 veut qu'un manifeste declare le lieu le plus eleve ou il peut servir, et la regle du
# projet est de ne relever ce plafond qu'apres une validation hors echantillon. Ce n'est PAS le
# cas ici : la campagne du 2026-10-08 a refuse 6 portes sur 9 sur ces deux strategies.
#
# Ce fichier existe donc pour repeter le systeme sur le COMPTE DE DEMONSTRATION, ou aucun argent
# reel n'est en jeu. `max_mode: DEMO` est un plafond borne : il ne peut pas atteindre le compte
# reel, qui exigerait `max_mode: LIVE` ET les neuf portes franchies (RM-016, RM-017).
#
# Chiffres de validation qui manquent, a la date de la derogation (11 999 bougies M15) :
#   * profit factor net (1x couts) mesure 0,92 (BTC) et 1,04 (or), exige 1,20 ; a 2x couts
#     (porte stress) il retombe a 0,81 (BTC) et 0,90 (or) ;
#   * p-value minimale 0,3497, contre la ligne de Bonferroni 0,016667, soit 21 fois au-dessus ;
#   * 0 survivant sur 6 apres correction du taux de fausses decouvertes.
#
# Le catalogue refuse tout manifeste au-dessus de SIGNAL qui ne porte pas ce bandeau :
# l'escalade silencieuse est impossible (voir docs/decisions/2026-10-08-mode-ceiling-derogation.md).
#
# Second production strategy, assigned to bitcoin so each market runs a genuinely different
# rule (Donchian breakout + trend filter vs EMA crossover). NOT a trading recommendation:
# max_mode stays SIGNAL until TASK-064/TASK-065 validate it out of sample.
strategy_id: trend_breakout
version: 1.0.1
max_mode: DEMO
allowed_symbols: [BTCUSD]
timeframes: [M15]
# 5 x trend_period: the EMA(100) is recursive and must be warmed up identically in
# backtest and production.
history_bars: 600
expiry_bars: 1
ai_filter: shadow
parameters:
  channel_period: 20
  trend_period: 100
  atr_period: 14
  stop_atr_multiplier: 2.0
  take_profit_rr: 2.0
  # 0,13 ATR au lieu de 0,1, et ce n'est pas un pas rond : c'est le seuil MESURE.
  #
  # Le 2026-10-09, quatre signaux sur six ont ete refuses par `entry_zone`, et le motif etait
  # toujours le meme : l'ask sortait de la bande. La cause est arithmetique — sur BTCUSD, la
  # bande de 0,1 ATR vaut ~19,2 $ quand le spread en vaut 18,4 (mesure en base sur les
  # decisions de risque : 18,424 et 19,443). Le spread mangeait donc 96 % du budget de bande
  # avant que le prix n'ait bouge d'un point.
  #
  # Le seul discriminant reel n'est pas le spread mais la DERIVE du prix entre le signal et le
  # remplissage : au-dela de ~13 $ (0,054 ATR) les entrees perdent avec un PF de 0,41 ;
  # entre 5,7 et 13 $ elles gagnent. La regle coupait a 5,7 $, donc bien avant le seuil utile.
  # 0,13 ATR ramene le budget de derive a 13 $ exactement.
  #
  # Mesure sur 59 999 bougies M15, spread observe : 802 operations, PF 0,8748 et +101,62 EUR
  # contre PF 0,8487 pour la regle actuelle — les refus passent de 368 a 185.
  # Detail : docs/research/execution-diagnostic/2026-10-09-parite-backtest-production.md
  #
  # L'OR N'EST PAS CONCERNE et garde 0,1 : son spread vaut 0,31 $ pour une bande de 0,78 $,
  # soit 40 % du budget. Ses cinq decisions de risque ont toutes ete autorisees. Appliquer le
  # chiffre du bitcoin a l'or serait transposer une mesure faite sur un autre marche.
  entry_zone_atr: 0.13
