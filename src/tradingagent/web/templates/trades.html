{% extends "base.html" %}
{% from "_icons.html" import icon, head, fold, badge, nothing %}
{% from "_macros.html" import pager, market_select, option_select, search_field %}
{% block title %}Trades{% endblock %}
{% block content %}
{% set page = listing.page %}

<form class="filters" method="get" action="/trades">
  {# Chaque filtre reste un <select> natif, avec son nom et son libellé : le script de
     base.html le double d'un bouton stylé quand JavaScript est là, et le laisse tel quel
     sinon. Le menu déroulant est donc une amélioration, jamais une condition d'usage. #}
  {{ market_select(page, listing.markets) }}
  {{ option_select("strategy", "Stratégie", listing.strategies,
                   page.filter_value("strategy"), "Toutes") }}
  {% set mode_labels = {} %}
  {% for mode in modes %}{% set _ = mode_labels.update({mode.value: display.mode_label(mode) ~ " (" ~ mode.value ~ ")"}) %}{% endfor %}
  {{ option_select("mode", "Mode", modes | map(attribute="value") | list,
                   page.filter_value("mode"), "Tous", mode_labels) }}
  {{ search_field("trades-q", "Recherche", page.query,
                  "symbole, stratégie, ticket") }}
  <div><button type="submit">{{ icon("filter") }}Filtrer</button></div>
</form>

<div class="cards" title="Chiffres calculés sur la sélection courante">
  <div class="card"><div class="label">{{ icon("euro") }}Résultat net</div>
    <div class="value {{ display.ratio_class(listing.performance.net_profit) }}">{{ display.money(listing.performance.net_profit, signed=True) }}</div></div>
  <div class="card"><div class="label">{{ icon("receipt") }}Trades</div><div class="value">{{ listing.performance.trades }}</div>
    <dl class="facts"><div><dt>Gagnants</dt><dd>{{ listing.performance.wins }}</dd></div><div><dt>Perdants</dt><dd>{{ listing.performance.losses }}</dd></div></dl></div>
  <div class="card"><div class="label">{{ icon("percent") }}Taux de réussite</div><div class="value">{{ display.percent(listing.performance.win_rate) }}</div></div>
  <div class="card"><div class="label">{{ icon("gauge") }}Facteur de profit</div><div class="value">{{ display.ratio(listing.performance.profit_factor) }}</div></div>
</div>

<div class="dash">
  <section class="mod wide" aria-labelledby="h-trade-bars">
    {{ head("h-trade-bars", "bar-chart", "Résultat par trade (sélection courante)") }}
    <div class="chart is-loading" data-chart="pnl-bars" data-mode="trade" aria-busy="true"></div>
  </section>
</div>

<div class="actions">
  <a href="/export/trades.csv?market={{ page.market }}&strategy={{ page.filter_value("strategy") }}&mode={{ page.filter_value("mode") }}" title="Exporter la sélection">{{ icon("download") }}CSV</a>
  <a href="/export/trades.json?market={{ page.market }}&strategy={{ page.filter_value("strategy") }}&mode={{ page.filter_value("mode") }}" title="Exporter la sélection">{{ icon("download") }}JSON</a>
</div>

<div class="table-wrap" data-limit="5">
<table>
  <caption class="sr-only">Trades clôturés, marché {{ page.market }} : {{ page.total }} trade(s) clôturé(s) pour cette sélection, affichage {{ page.showing }}</caption>
  <thead>
    <tr><th scope="col">Clôturé le (UTC)</th><th scope="col">Marché</th><th scope="col">Stratégie</th><th scope="col">Sens</th><th scope="col">Unité de temps</th>
        <th scope="col">Mode</th><th scope="col" class="num">P&amp;L</th><th scope="col" class="num">Risque</th><th scope="col">Durée</th><th scope="col">Détail</th></tr>
  </thead>
  <tbody id="trades-body">
    {% for entry in page.rows %}
      {% set trade = entry.trade %}
      <tr>
        <td>{{ display.moment(trade.closed_at) }}</td>
        <td>{{ trade.symbol }}</td>
        <td>{{ trade.strategy_ref }}</td>
        <td>{{ display.direction_label(trade.direction) }}</td>
        <td>{{ trade.timeframe.value }}</td>
        <td>{{ display.mode_label(trade.mode) }}</td>
        <td class="num {{ display.ratio_class(trade.pnl_eur) }}">{{ display.money(trade.pnl_eur, signed=True) }}</td>
        <td class="num">{{ display.money(trade.risk_eur) }}</td>
        <td>{{ display.duration(trade.closed_at - trade.opened_at) }}</td>
        <td><a href="/trades/{{ entry.signal_id }}" aria-label="Rejouer le trade {{ entry.signal_id }}">{{ icon("arrow-up-right") }}Rejouer</a></td>
      </tr>
    {% else %}
      <tr><td colspan="10" class="empty">{{ page.empty_message }}</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>

{{ pager(page, "Pagination des trades") }}

{% if detail %}
  <h2>Détail du trade</h2>
  <p><a href="/trades/{{ detail.signal_id }}">Replay complet</a></p>
  <div class="cards">
    <div class="card"><div class="label">Marché</div><div class="value">{{ detail.trade.symbol }}</div>
      <div class="note">{{ detail.trade.strategy_ref }} {{ detail.trade.timeframe.value }}</div></div>
    <div class="card"><div class="label">P&amp;L</div>
      <div class="value {{ display.ratio_class(detail.trade.pnl_eur) }}">{{ display.money(detail.trade.pnl_eur, signed=True) }}</div>
      <div class="note">risque {{ display.money(detail.trade.risk_eur) }}</div></div>
    <div class="card"><div class="label">Ouverture</div><div class="value sm">{{ display.precise(detail.trade.opened_at) }}</div>
      <div class="note">clôture {{ display.precise(detail.trade.closed_at) }}</div></div>
    <div class="card"><div class="label">Sortie</div><div class="value sm">{{ detail.exit_reason }}</div>
      <div class="note">prix de clôture {{ display.number(detail.close_price, 5) }}</div></div>
  </div>

  <h3>Signal d'origine</h3>
  <div class="table-wrap">
  <table>
    <caption class="sr-only">Signal d'origine</caption>
    <tbody>
      <tr><th scope="row">Identifiant</th><td>{{ detail.signal_id }}</td><th scope="row">État</th><td>{{ state_label(detail.signal_state) }}</td></tr>
      <tr><th scope="row">Prix observé</th><td>{{ display.number(detail.observed_price, 5) }}</td>
          <th scope="row">Zone d'entrée</th><td>{{ display.number(detail.entry_low, 5) }} - {{ display.number(detail.entry_high, 5) }}</td></tr>
      <tr><th scope="row">Stop</th><td>{{ display.number(detail.stop_loss, 5) }}</td>
          <th scope="row">Objectifs</th><td>{% for target in detail.take_profits %}{{ display.number(target, 5) }}{% if not loop.last %} · {% endif %}{% endfor %}</td></tr>
      <tr><th scope="row">Motif</th><td colspan="3">{{ detail.signal_reason }}</td></tr>
    </tbody>
  </table>
  </div>

  <h3>Indicateurs enregistrés au signal</h3>
  <div class="table-wrap">
  <table>
    <caption class="sr-only">Indicateurs enregistrés au signal</caption>
    <thead><tr><th scope="col">Indicateur</th><th scope="col" class="num">Valeur</th></tr></thead>
    <tbody>
      {% for name, value in detail.indicators.items() %}
        <tr><td>{{ name }}</td><td class="num">{{ display.number(value, 5) }}</td></tr>
      {% else %}
        <tr><td colspan="2" class="empty">Aucun indicateur enregistré.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  </div>

  <h3>Décision de risque</h3>
  <p>
    {% if detail.risk_outcome %}
      <span class="badge">{{ detail.risk_outcome }}</span> {{ detail.risk_reason }}
    {% else %}
      <span class="muted">Aucune décision de risque enregistrée pour ce signal.</span>
    {% endif %}
  </p>

  <h3>Exécutions ({{ detail.executions | length }})</h3>
  <div class="table-wrap">
  <table>
    <caption class="sr-only">Exécutions</caption>
    <thead><tr><th scope="col">Ticket</th><th scope="col" class="num">Prix</th><th scope="col" class="num">Volume</th>
               <th scope="col" class="num">Glissement</th><th scope="col">Exécutée le (UTC)</th></tr></thead>
    <tbody>
      {% for execution in detail.executions %}
        <tr>
          <td>{{ execution.broker_deal_ticket }}</td>
          <td class="num">{{ display.number(execution.price, 5) }}</td>
          <td class="num">{{ display.number(execution.volume, 2) }}</td>
          <td class="num">{{ display.number(execution.slippage, 4) }}</td>
          <td>{{ display.precise(execution.executed_at) }}</td>
        </tr>
      {% else %}
        <tr><td colspan="5" class="empty">Aucune exécution enregistrée.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
  <p class="muted">Ordre : {{ detail.order_state }}
     {%- if detail.broker_order_ticket %} · ticket courtier {{ detail.broker_order_ticket }}{% endif %}.</p>
{% endif %}

{% endblock %}
