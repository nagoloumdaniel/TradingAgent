# Every hook runs through uv so versions come from uv.lock, not from pinned remote revs.
repos:
  - repo: local
    hooks:
      # --no-verify: stock plugins otherwise send every candidate secret to its provider's API
      # and silently drop the ones that fail, making the hook network-dependent.
      - id: detect-secrets
        name: detect-secrets
        entry: >-
          uv run detect-secrets-hook --no-verify
          --plugin tools/detect_secrets_plugins/project_tokens.py
          --baseline .secrets.baseline
        language: system
        # `tests/indicators/test_perf_invariance.py` carries two frozen SHA-256 digests of
        # backtest output, and the entropy plugin cannot tell a digest from a key. The inline
        # `pragma: allowlist secret` does not help here: the plugin reports the line where the
        # hex literal *ends*, so a split literal puts the pragma on the wrong line, and a
        # single-line literal puts it past the 100-character limit. Excluding the one file is
        # the honest trade: it holds no credential and its purpose is to freeze a hash.
        exclude: >-
          ^uv\.lock$|^docs/research/.*\.json$|^scripts/analysis/.*\.json$|^tests/indicators/test_perf_invariance\.py$
      # The research artifacts are machine-written evidence: dataset fingerprints, evidence
      # digests, 64-character hex. The entropy plugin flags them every time, and they change
      # on every campaign run, so the baseline would need rewriting after each one — a
      # treadmill whose predictable end is somebody disabling the hook for good.
      #
      # They keep the check that matters here: the project's own token detector, which knows
      # the shapes this repository actually holds. A credential interpolated into a generated
      # report is still caught, and that is the case worth guarding.
      - id: detect-secrets
        name: detect-secrets (jetons du projet, artefacts de recherche)
        entry: >-
          uv run detect-secrets-hook --no-verify
          --plugin tools/detect_secrets_plugins/project_tokens.py
          --disable-plugin HexHighEntropyString
          --baseline .secrets.baseline
        language: system
        files: ^docs/research/.*\.json$|^scripts/analysis/.*\.json$
      - id: detect-private-key
        name: detect-private-key
        entry: uv run detect-private-key
        language: system
        types: [text]
      - id: check-added-large-files
        name: check-added-large-files
        entry: uv run check-added-large-files --maxkb=500
        language: system
        # Frozen market datasets are the project's research evidence, and they are versioned
        # on purpose: a backtest is only reproducible if the exact bars it ran on are in the
        # repository. At 12 000 M15 bars a series is about a megabyte, over the general
        # limit, so the exemption is scoped to those directories rather than raising the
        # limit for every file in the project.
        #
        # The scope was widened on 2026-10-08 to the sibling directories the first pattern
        # never matched: `^docs/research/datasets/` ends in a literal slash, so `datasets-long/`
        # and `datasets-h1/` -- the H1/H4 and 60 000-bar sets -- were refused at commit time
        # while looking exempt. The three directories are named explicitly: a character class
        # such as `[A-Z-]` matches one character and would silently miss `datasets-long`,
        # which is exactly the failure being repaired here. A file such as
        # `datasets-report.json` still goes through the 500 kB check.
        #
        # `datasets-native-h1` was added on 2026-10-09: 87 694 native H1 bars of BTCUSD since
        # 2011, 8.3 MB, and the only set in the repository that no campaign had ever read. It
        # is the evidence behind the project's first out-of-sample threshold crossing, so it is
        # versioned rather than left to be re-fetched from a terminal that may not serve it
        # again -- the same reason the other sets are here.
        # `datasets-volume` was added on 2026-10-09: the BTCUSD and XAUUSD M15 sets fetched with
        # tick volume, which the older sets do not carry at all. The VWAP pullback rule refuses
        # to run without volume -- a VWAP without volume is just a moving average -- so these
        # are the only datasets that can measure it, and that measurement is the evidence.
        exclude: >-
          ^docs/research/(datasets|datasets-long|datasets-h1|datasets-native-h1|datasets-volume|archive)/
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: uv run end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
        types: [text]
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: architecture
        name: architecture boundaries
        entry: uv run pytest -q tests/test_architecture.py
        language: system
        types: [python]
        pass_filenames: false
